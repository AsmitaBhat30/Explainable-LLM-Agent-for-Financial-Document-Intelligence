<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Animated preview of the Explainable LLM Agent UI cycling through three regulatory queries">
<defs><style>
.m{font-family:'SF Mono','Cascadia Code','Fira Code','Consolas',ui-monospace,monospace}
.s{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif}
.sans{font-family:-apple-system,'Segoe UI',Roboto,sans-serif}

/* 21s cycle — 3 scenes, each visible for ~30% of the loop with a brief
   cut between them. Percentage scheme: scene N visible from ~(N-1)*33.5+2%
   to ~(N-1)*33.5+30%, mirroring the timing style of the original demo.svg. */
@keyframes lp{0%,100%{opacity:1}50%{opacity:.25}}
.lp{animation:lp 1.6s ease-in-out infinite}

@keyframes sc1{0%,1.9%,30.1%,100%{opacity:0}2%,30%{opacity:1}}
@keyframes sc2{0%,34.9%,63.1%,100%{opacity:0}35%,63%{opacity:1}}
@keyframes sc3{0%,67.9%,96.1%,100%{opacity:0}68%,96%{opacity:1}}
.scene1{animation:sc1 21s linear infinite}
.scene2{animation:sc2 21s linear infinite}
.scene3{animation:sc3 21s linear infinite}

@keyframes dot0{0%,1.9%,30.1%,100%{fill:#B4C0BB;r:2.5}2%,30%{fill:#35606B;r:6}}
@keyframes dot1{0%,34.9%,63.1%,100%{fill:#B4C0BB;r:2.5}35%,63%{fill:#35606B;r:6}}
@keyframes dot2{0%,67.9%,96.1%,100%{fill:#B4C0BB;r:2.5}68%,96%{fill:#35606B;r:6}}
.dot0{animation:dot0 21s linear infinite}
.dot1{animation:dot1 21s linear infinite}
.dot2{animation:dot2 21s linear infinite}
</style></defs>

<!-- Page background -->
<rect x="0" y="0" width="900" height="480" fill="#F3F5F4"/>

<!-- Topbar -->
<rect x="0" y="0" width="900" height="40" fill="#FFFFFF"/>
<line x1="0" y1="40" x2="900" y2="40" stroke="#DCE2DF" stroke-width="1"/>
<circle cx="24" cy="20" r="3.5" fill="#35606B"/>
<text x="36" y="24" class="s sans" font-size="13" font-weight="600" fill="#1B2320">Explainable LLM Agent · Financial Document Intelligence</text>
<rect x="700" y="10" width="108" height="20" rx="10" fill="#F5EFE3" stroke="#D8C99A"/>
<circle cx="712" cy="20" r="3" fill="#97742A" class="lp"/>
<text x="722" y="24" class="m" font-size="9.5" font-weight="600" fill="#97742A" letter-spacing="0.4">AUTOPLAY DEMO</text>
<rect x="818" y="10" width="64" height="20" rx="10" fill="#E9F0EC"/>
<circle cx="830" cy="20" r="3" fill="#2E5E45" class="lp"/>
<text x="840" y="24" class="m" font-size="9.5" font-weight="600" fill="#2E5E45">READY</text>

<!-- Query bar -->
<rect x="0" y="40" width="900" height="46" fill="#EAEDEB"/>
<line x1="0" y1="86" x2="900" y2="86" stroke="#DCE2DF" stroke-width="1"/>
<text x="24" y="55" class="m" font-size="9" letter-spacing="1.2" fill="#35606B" font-weight="700">QUERY</text>
<text x="24" y="75" class="m" font-size="12" fill="#35606B">›</text>

<g class="scene1">
  <text x="40" y="75" class="m" font-size="12" fill="#1B2320">What are the minimum capital requirements under Basel III?</text>
</g>
<g class="scene2">
  <text x="40" y="75" class="m" font-size="12" fill="#1B2320">Does GDPR's right to erasure apply to transaction records?</text>
</g>
<g class="scene3">
  <text x="40" y="75" class="m" font-size="12" fill="#1B2320">What position limits apply under MiFID II for commodities?</text>
</g>

<!-- Column divider -->
<line x1="560" y1="86" x2="560" y2="480" stroke="#DCE2DF" stroke-width="1"/>

<!-- ── Left column (shared chrome) ── -->
<rect x="0" y="86" width="560" height="60" fill="#EAEDEB"/>
<line x1="0" y1="146" x2="560" y2="146" stroke="#DCE2DF" stroke-width="1"/>

<!-- Status rows (shared per-scene, checkmarks always green in this poster) -->
<g font-family="ui-monospace,monospace" font-size="10.5" fill="#5B6864">
  <circle cx="26" cy="100" r="7" fill="#DDF0E3"/><text x="26" y="103.5" text-anchor="middle" font-size="8" fill="#2E5E45">✓</text>
  <text x="40" y="104">Retrieval complete</text>
  <circle cx="26" cy="118" r="7" fill="#DDF0E3"/><text x="26" y="121.5" text-anchor="middle" font-size="8" fill="#2E5E45">✓</text>
  <text x="40" y="122">Compliance check done</text>
  <circle cx="26" cy="136" r="7" fill="#DDF0E3"/><text x="26" y="139.5" text-anchor="middle" font-size="8" fill="#2E5E45">✓</text>
  <text x="40" y="140">Response complete</text>
</g>

<!-- Answer panel -->
<rect x="16" y="158" width="528" height="230" rx="10" fill="#FFFFFF" stroke="#DCE2DF"/>
<text x="34" y="182" class="m" font-size="9.5" letter-spacing="1" fill="#35606B" font-weight="700">RESPONSE</text>

<g class="scene1">
  <text x="34" y="205" class="sans" font-size="12.5" fill="#1B2320">Minimum CET1 ratio is 4.5%, Tier 1 6%, and total capital 8%</text>
  <text x="34" y="224" class="sans" font-size="12.5" fill="#1B2320">(CRR Art. 92), plus a 2.5% Capital Conservation Buffer under</text>
  <text x="34" y="243" class="sans" font-size="12.5" fill="#1B2320">Basel III — an effective CET1 minimum of 7%.</text>
  <g font-family="ui-monospace,monospace" font-size="10" font-weight="600" fill="#35606B">
    <rect x="34" y="266" width="126" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="45" y="280">basel_iii_2017 · CCB</text>
    <rect x="168" y="266" width="102" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="179" y="280">crr_2013 · Art.92</text>
    <rect x="278" y="266" width="132" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="289" y="280">basel_iii_2017 · Leverage</text>
  </g>
  <g font-family="ui-monospace,monospace" font-size="10" fill="#5B6864">
    <text x="34" y="310">confidence: <tspan fill="#2E5E45" font-weight="700">86%</tspan></text>
    <text x="130" y="310">·</text>
    <text x="140" y="310">risk: <tspan fill="#2E5E45" font-weight="700">LOW</tspan></text>
    <text x="200" y="310">·</text>
    <text x="210" y="310">latency: <tspan fill="#1B2320">2840 ms</tspan></text>
  </g>
</g>

<g class="scene2">
  <text x="34" y="205" class="sans" font-size="12.5" fill="#1B2320">GDPR Art. 17 erasure rights are limited by PSD2 Art. 94's</text>
  <text x="34" y="224" class="sans" font-size="12.5" fill="#1B2320">fraud-prevention retention and §154 KWG's statutory retention</text>
  <text x="34" y="243" class="sans" font-size="12.5" fill="#1B2320">period — flagged for human review.</text>
  <g font-family="ui-monospace,monospace" font-size="10" font-weight="600" fill="#35606B">
    <rect x="34" y="266" width="112" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="45" y="280">gdpr_2016 · Art.17</text>
    <rect x="154" y="266" width="112" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="165" y="280">psd2_2015 · Art.94</text>
    <rect x="274" y="266" width="128" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="285" y="280">bafin_kwg · §154 KWG</text>
  </g>
  <rect x="34" y="292" width="330" height="18" rx="3" fill="#FBF1E4" stroke="#D8C99A"/>
  <text x="42" y="305" font-family="ui-monospace,monospace" font-size="9.5" fill="#97742A">⚠ requires_review: true — human oversight recommended</text>
  <g font-family="ui-monospace,monospace" font-size="10" fill="#5B6864">
    <text x="34" y="330">confidence: <tspan fill="#2E5E45" font-weight="700">79%</tspan></text>
    <text x="130" y="330">·</text>
    <text x="140" y="330">risk: <tspan fill="#A23B2E" font-weight="700">HIGH</tspan></text>
    <text x="205" y="330">·</text>
    <text x="215" y="330">latency: <tspan fill="#1B2320">3210 ms</tspan></text>
  </g>
</g>

<g class="scene3">
  <text x="34" y="205" class="sans" font-size="12.5" fill="#1B2320">MiFID II Art. 57 sets commodity position limits at 25% of</text>
  <text x="34" y="224" class="sans" font-size="12.5" fill="#1B2320">deliverable supply (spot-month) per RTS 21; CRR Art. 355 sets</text>
  <text x="34" y="243" class="sans" font-size="12.5" fill="#1B2320">own-funds requirements for the position risk.</text>
  <g font-family="ui-monospace,monospace" font-size="10" font-weight="600" fill="#35606B">
    <rect x="34" y="266" width="118" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="45" y="280">mifid2_2014 · Art.57</text>
    <rect x="160" y="266" width="112" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="171" y="280">mifid2_2014 · RTS21</text>
    <rect x="280" y="266" width="108" height="20" rx="10" fill="#F3F5F4" stroke="#DCE2DF"/><text x="291" y="280">crr_2013 · Art.355</text>
  </g>
  <g font-family="ui-monospace,monospace" font-size="10" fill="#5B6864">
    <text x="34" y="310">confidence: <tspan fill="#2E5E45" font-weight="700">83%</tspan></text>
    <text x="130" y="310">·</text>
    <text x="140" y="310">risk: <tspan fill="#2E5E45" font-weight="700">LOW</tspan></text>
    <text x="200" y="310">·</text>
    <text x="210" y="310">latency: <tspan fill="#1B2320">2670 ms</tspan></text>
  </g>
</g>

<!-- ── Right column ── -->
<text x="580" y="102" class="m" font-size="8.5" letter-spacing="1.4" fill="#5B6864">AGENT PIPELINE</text>
<line x1="560" y1="112" x2="900" y2="112" stroke="#DCE2DF" stroke-width="1"/>

<g font-family="ui-monospace,monospace" font-size="10.5">
  <rect x="576" y="122" width="308" height="28" rx="8" fill="#EDF4F0" stroke="#9EC4B2"/>
  <circle cx="592" cy="136" r="3.5" fill="#2E5E45"/><text x="604" y="140" fill="#1B2320">RetrieverAgent</text><text x="850" y="140" fill="#B4C0BB" font-size="9">FAISS</text>

  <rect x="576" y="156" width="308" height="28" rx="8" fill="#EDF4F0" stroke="#9EC4B2"/>
  <circle cx="592" cy="170" r="3.5" fill="#2E5E45"/><text x="604" y="174" fill="#1B2320">ComplianceAgent</text><text x="836" y="174" fill="#B4C0BB" font-size="9">LangChain</text>

  <rect x="576" y="190" width="308" height="28" rx="8" fill="#EDF4F0" stroke="#9EC4B2"/>
  <circle cx="592" cy="204" r="3.5" fill="#2E5E45"/><text x="604" y="208" fill="#1B2320">ExplanationAgent</text><text x="846" y="208" fill="#B4C0BB" font-size="9">GPT-4o</text>
</g>

<text x="580" y="238" class="m" font-size="8.5" letter-spacing="1.4" fill="#5B6864">RETRIEVED DOCUMENTS</text>
<line x1="560" y1="248" x2="900" y2="248" stroke="#DCE2DF" stroke-width="1"/>

<g class="scene1" font-family="ui-monospace,monospace">
  <rect x="576" y="258" width="308" height="34" rx="7" fill="#FFFFFF" stroke="#DCE2DF"/>
  <text x="588" y="272" font-size="9" fill="#5B6864">basel_iii_2017</text><text x="850" y="272" font-size="9.5" fill="#35606B" font-weight="700">94%</text>
  <text x="588" y="285" font-size="9.5" fill="#1B2320">Capital Conservation Buffer</text>
  <rect x="576" y="298" width="308" height="34" rx="7" fill="#FFFFFF" stroke="#DCE2DF"/>
  <text x="588" y="312" font-size="9" fill="#5B6864">crr_2013</text><text x="850" y="312" font-size="9.5" fill="#35606B" font-weight="700">91%</text>
  <text x="588" y="325" font-size="9.5" fill="#1B2320">Article 92</text>
</g>
<g class="scene2" font-family="ui-monospace,monospace">
  <rect x="576" y="258" width="308" height="34" rx="7" fill="#FFFFFF" stroke="#DCE2DF"/>
  <text x="588" y="272" font-size="9" fill="#5B6864">gdpr_2016</text><text x="850" y="272" font-size="9.5" fill="#35606B" font-weight="700">96%</text>
  <text x="588" y="285" font-size="9.5" fill="#1B2320">Article 17</text>
  <rect x="576" y="298" width="308" height="34" rx="7" fill="#FFFFFF" stroke="#DCE2DF"/>
  <text x="588" y="312" font-size="9" fill="#5B6864">psd2_2015</text><text x="850" y="312" font-size="9.5" fill="#35606B" font-weight="700">85%</text>
  <text x="588" y="325" font-size="9.5" fill="#1B2320">Article 94</text>
</g>
<g class="scene3" font-family="ui-monospace,monospace">
  <rect x="576" y="258" width="308" height="34" rx="7" fill="#FFFFFF" stroke="#DCE2DF"/>
  <text x="588" y="272" font-size="9" fill="#5B6864">mifid2_2014</text><text x="850" y="272" font-size="9.5" fill="#35606B" font-weight="700">95%</text>
  <text x="588" y="285" font-size="9.5" fill="#1B2320">Article 57</text>
  <rect x="576" y="298" width="308" height="34" rx="7" fill="#FFFFFF" stroke="#DCE2DF"/>
  <text x="588" y="312" font-size="9" fill="#5B6864">mifid2_2014</text><text x="850" y="312" font-size="9.5" fill="#35606B" font-weight="700">88%</text>
  <text x="588" y="325" font-size="9.5" fill="#1B2320">RTS 21 — Position Limit Methodology</text>
</g>

<!-- Progress bar -->
<line x1="560" y1="346" x2="900" y2="346" stroke="#DCE2DF" stroke-width="1"/>
<text x="576" y="364" class="m" font-size="9" fill="#5B6864">Complete</text>
<text x="868" y="364" class="m" font-size="9" fill="#5B6864">100%</text>
<rect x="576" y="370" width="308" height="3" rx="1.5" fill="#B4C0BB"/>
<rect x="576" y="370" width="308" height="3" rx="1.5" fill="#35606B"/>

<!-- Scenario dots -->
<circle cx="712" cy="410" r="3" class="dot0"/>
<circle cx="728" cy="410" r="3" class="dot1"/>
<circle cx="744" cy="410" r="3" class="dot2"/>

</svg>
